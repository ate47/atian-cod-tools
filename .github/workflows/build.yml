name: Build

on:
  push:
    paths:
      - "src/**"
      - "premake5.lua"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "src/**"
  workflow_dispatch:
    inputs:
      release:
        description: "Release after build"
        required: true
        type: boolean
      gpl:
        description: "GPL build"
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Atian Tools Build
    runs-on: windows-latest
    permissions:
      contents: read
      packages: write
    env:
      VCPKG_DOWNLOADS: ${{ github.workspace }}/vcpkg-downloads
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
      ACTS_REPOSITORY: "https://github.com/${{ github.repository }}"
    steps:
      - uses: actions/checkout@v3.5.3
        with:
          submodules: recursive
      - name: Cache vcpkg downloads
        uses: actions/cache@v4
        with:
          path: vcpkg-downloads
          key: downloads-${{ runner.os }}
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-
              
      - name: Bootstrap vcpkg (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path vcpkg-cache
          New-Item -ItemType Directory -Force -Path vcpkg-downloads
          ./vcpkg/bootstrap-vcpkg.bat
      - name: Bootstrap vcpkg (Not Windows)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: |
          mkdir -p vcpkg-cache
          mkdir -p vcpkg-downloads
          ./vcpkg/bootstrap-vcpkg.sh
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
      - name: Get version
        id: get_version
        shell: pwsh
        run: "\"version=$(scripts/getversion.ps1)\" | Out-File $env:GITHUB_OUTPUT"
      - name: Version
        run: "\"version: ${{ steps.get_version.outputs.version }}\""
      - name: Install LLVM Clang
        uses: KyleMayes/install-llvm-action@v2.0.9
        with:
          version: "22.1.7"
          force-url: "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.7/LLVM-22.1.7-win64.exe"
      - name: clang format version
        shell: pwsh
        run: . "$env:LLVM_PATH/bin/clang-format.exe" --version
      - name: Prepare project
        shell: pwsh
        run: scripts/setupdater.ps1 -versionEndpoint "https://github.com/${{ github.repository }}/releases/latest/download/version" -zipEndpoint "https://github.com/${{ github.repository }}/releases/latest/download/acts.zip" -projectUrl "https://github.com/${{ github.repository }}" -project "${{ github.repository }}" 
      - name: Create project (GPL)
        if: ${{ inputs.gpl }}
        run: cmake -S . -B build --preset ci-gpl
      - name: Create project (MIT)
        if: ${{ !inputs.gpl }}
        run: cmake -S . -B build --preset ci
      - name: Validate project format
        run: cmake --build build --target check-format
      - name: Build project
        shell: pwsh
        run: msbuild build/AtianCodTools.slnx /p:Configuration=Release /p:Platform=x64
      - name: Run tests
        run: build/bin/Release/acts.exe --noUpdater -l p -d -t utest
      - name: Package project
        shell: pwsh
        run: scripts/package.ps1 -deployQt
      - name: Upload dev release
        if: github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1
        with:
          commit: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: "latest_build"
          artifacts: "build/package/acts.zip,build/package/acts-dev.zip,build/package/acts/bin/acts-shield-plugin.dll,build/package/acts/bin/version"
          artifactErrorsFailBuild: true
          makeLatest: false
          removeArtifacts: true
          replacesArtifacts: true
          allowUpdates: true
          name: "Dev build ${{ steps.get_version.outputs.version }}"
          body: "Latest dev build, [get the latest release build here](https://github.com/${{ github.repository }}/releases/latest)."
      - name: Upload release
        if: inputs.release && github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1
        with:
          commit: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "build/package/acts.zip,build/package/acts-dev.zip,build/package/acts/bin/acts-shield-plugin.dll,build/package/acts/bin/version"
          artifactErrorsFailBuild: true
          makeLatest: true
          tag: "${{ steps.get_version.outputs.version }}"
          name: "${{ steps.get_version.outputs.version }}"
          bodyFile: release/RELEASE.MD


